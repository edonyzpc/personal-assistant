name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Classify validation scope
        id: validation_scope
        # Missing output or a classifier failure takes the full path below.
        continue-on-error: true
        env:
          CI_VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-validation-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check platform guards
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: bash scripts/check-platform-guards.sh
      - name: Self-test platform guards
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: bash scripts/test-platform-guards.sh
      - name: Check third-party notices
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: npm run check:third-party-notices
      - name: Check documentation workflow (advisory)
        id: docs_check
        continue-on-error: true
        env:
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run docs:check
      - name: Report documentation workflow findings
        if: ${{ steps.docs_check.outcome == 'failure' }}
        run: echo "::warning title=Documentation workflow findings::npm run docs:check reported lifecycle findings. Review the advisory step; source and runtime validation will continue."
      - name: Test documentation contracts
        if: ${{ steps.validation_scope.outcome == 'success' && steps.validation_scope.outputs.scope == 'docs' }}
        run: npm run test:docs -- --runInBand
      - name: Lint
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: npm run lint
      - name: Build
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: npm run build
      - name: Test
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        # Leave CPU and memory headroom for coverage and native SDK I/O.
        run: /usr/bin/time -v npm run test:all -- --maxWorkers=2 --coverage --logHeapUsage --json --outputFile=/tmp/pa-ci-tests.json
      - name: Report test resource evidence
        if: ${{ always() && (steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs') }}
        run: |
          node <<'NODE'
          const os = require('node:os');
          const fs = require('node:fs');
          console.log(JSON.stringify({ availableCpu: os.availableParallelism(), cpu: os.cpus()[0]?.model,
            totalMemoryGiB: +(os.totalmem() / 2 ** 30).toFixed(2), workers: 2 }));
          for (const path of ['/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/memory.max']) {
            if (fs.existsSync(path)) console.log(`${path}: ${fs.readFileSync(path, 'utf8').trim()}`);
          }
          const path = '/tmp/pa-ci-tests.json';
          if (fs.existsSync(path)) {
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const suite of results.testResults ?? []) {
              if (!/(task-source-runtime-admission|pa-agent-runtime-eval)\.test\.ts$/.test(suite.name)) continue;
              console.log(JSON.stringify({ suite: suite.name.split('/').pop(), status: suite.status,
                durationMs: suite.endTime - suite.startTime, tests: suite.assertionResults.map(test => ({
                  name: test.fullName, status: test.status, durationMs: test.duration,
                })) }));
            }
          }
          NODE
      - name: Audit bundle
        if: ${{ steps.validation_scope.outcome != 'success' || steps.validation_scope.outputs.scope != 'docs' }}
        run: npm run audit:bundle
