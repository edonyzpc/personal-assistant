    }
    function section(title,extra){const s=create('section','pa-content-section');const h=create('h4','pa-section-label',title);if(extra)h.append(create('span','',extra));s.append(h);content.append(s);return s;}
    function code(s,value){s.append(create('pre','pa-code',typeof value==='string'?value:JSON.stringify(value,null,2)));}
    function message(s,role,text){const m=create('div','pa-message');m.append(create('span','pa-message-role',role),create('p','pa-prose',text));s.append(m);}
    function kv(s,key,value){const row=create('div','pa-kv');row.append(create('span','',key),create('span','',value));s.append(row);return row;}
    function notice(text,jump){const box=create('div','pa-notice');box.append(icon('info'));const body=create('div','',text);if(jump){body.append(create('br'));const b=create('button','pa-jump cursor-interaction','查看失败的第一次请求');b.type='button';b.append(icon('arrow-up-right'));b.onclick=()=>{reveal(jump);choose(jump);scrollSelected();};body.append(b);}box.append(body);content.append(box);}
    function renderDetails(force=false){
      const n=run.nodes.find(x=>x.id===selected)||available()[0]; if(!n)return;
      const status=statusOf(n);const detailKey=[run.id,n.id,tab,status,n.retry&&clock>=10.1?'retried':'',tab==='timing'?n.milestones?.filter(x=>x[1]<=clock).length||0:0].join('|');
      if(!force&&detailKey===lastDetailKey){for(const el of root.querySelectorAll('[data-elapsed]'))el.textContent=fmt(durationOf(n));return;}
      const preserve=lastDetailKey.startsWith(`${run.id}|${n.id}|${tab}|`);const oldScroll=content.scrollTop;
      const disclosures=new Map([...content.querySelectorAll('[data-disclosure]')].map(el=>[el.dataset.disclosure,el.open]));
      const focusedDisclosure=content.contains(document.activeElement)?document.activeElement.closest('[data-disclosure]')?.dataset.disclosure:null;
      lastDetailKey=detailKey;
      $('#pa-breadcrumb').textContent=parents(n.id).slice(0,-1).map(x=>x.name).join(' / ')||run.name;
      $('#pa-detail-title').replaceChildren(icon(glyphs[n.kind]),create('span','',nameOf(n)));
      $('#pa-detail-subtitle').textContent=n.code||`${labels[n.kind]} · ${run.id}/${n.id}`;
      const meta=$('#pa-detail-meta');const elapsed=create('span','',fmt(durationOf(n)));elapsed.dataset.elapsed='true';meta.replaceChildren(create('span',`pa-chip pa-chip-${status}`,stateLabels[status]),elapsed,create('span','',labels[n.kind]));
      if(n.tokens && status!=='running')meta.append(create('span','',`${n.tokens[0].toLocaleString()} → ${n.tokens[1].toLocaleString()} tokens`));
      for(const button of root.querySelectorAll('[data-tab]'))button.setAttribute('aria-selected',String(button.dataset.tab===tab));
      content.setAttribute('aria-labelledby',`pa-tab-${tab}`);content.replaceChildren();
      if(n.retry&&clock>=10.1)notice(clock<19.8?'第一次请求失败，正在恢复。':'第一次请求失败，重试后完成。失败记录保留在子节点中。','attempt1');
      if(n.status==='gap'||(run.id==='gap'&&n.id==='run'))notice('采集于运行中途开启。缺失内容没有被补写，未知起点不绘制确定时间条。');
      if(tab==='raw'){
        const s=section('节点记录','示例');code(s,{nodeId:n.id,parentId:n.parent,type:n.kind,status,startSeconds:n.start,endSeconds:status==='running'?null:n.end,durationSeconds:status==='running'?null:durationOf(n),input:n.input??(n.kind==='model'?'见调用消息':null),output:status==='running'?'接收中':n.output??null,...(n.error&&status==='error'?{error:n.error}:{}),...(n.tokens&&status!=='running'?{usage:{input:n.tokens[0],output:n.tokens[1]}}:{})});
      }else if(tab==='timing'){
        const s=section('时间');kv(s,'相对 Run 起点',n.start===null?'未记录':`${n.start.toFixed(2)} s`);kv(s,'结束时间',status==='running'?'尚未结束':`${n.end?.toFixed(2)??'未知'} s`);kv(s,'耗时',fmt(durationOf(n))).lastElementChild.dataset.elapsed='true';
        if(n.milestones){const m=section('调用里程碑');for(const [label,at] of n.milestones.filter(x=>x[1]<=clock)){const row=create('div','pa-step');row.append(create('span','pa-step-dot'),create('span','',label),create('span','pa-step-time',`${at.toFixed(1)} s`));m.append(row);}}
        if(n.tokens && status!=='running'){const u=section('Token 用量','Provider 返回');kv(u,'输入',n.tokens[0].toLocaleString());kv(u,'输出',n.tokens[1].toLocaleString());kv(u,'合计',(n.tokens[0]+n.tokens[1]).toLocaleString());if(n.retry)u.append(create('p','pa-prose','本处展示成功请求的已知用量；失败请求未返回用量。'));}else{section('Token 用量').append(create('p','pa-prose',n.kind==='tool'?'工具执行不直接产生模型 token 用量。':status==='running'?'调用尚未结束，最终用量还未返回。':'此节点没有独立的已知用量记录。'));}
        if(n.kind==='phase'&&n.name.includes('并行'))section('并发关系').append(create('p','pa-prose','子工具在同一时间轴上重叠。本阶段耗时取实际起止，不累加并行工具的耗时。'));
      }else{
        if(n.error&&status==='error'){const e=section('错误');code(e,n.error);}
        const input=section(n.kind==='tool'?'工具参数':'输入',n.kind==='model'?'调用消息 · 示例':'');
        if(n.kind==='model'||n.kind==='attempt'){
          message(input,'system','依据提供的笔记回答；给出可核查的引用，不补写未提供的事实。');
          message(input,'user',run.id==='standard'?'关联本周笔记中的共同主题，并给出原文依据。':run.id==='long'?'梳理项目决策的演变，按来源核对每个阶段。':'检查这些笔记之间的关联。');
          let contextLabel='上下文',contextText='';
          if(run.id==='standard'&&n.id==='model1'){contextLabel='上下文 · 请求与工具描述';contextText='可用工具：search_notes、get_current_note_context。\n当前尚未获得检索结果。';}
          else if(run.id==='standard'&&n.id==='model3'){contextLabel='上下文 · 上一轮综合结果';contextText='上一轮已生成三个共同主题与对应笔记引用。本轮核对引用，并整理最终回复。';}
          else if(run.id==='standard'){contextLabel='上下文 · 2 篇笔记与检索摘要';contextText='[低负担回顾]\n回顾应该像想起来了，而不是又多了一组待处理。\n\n[渐进式信任]\n能力需要通过可检查的证据逐步获得信任。';}
          else if(run.id==='long'){contextLabel='上下文 · 本轮任务';contextText=`当前任务：${parents(n.id).find(x=>x.kind==='turn')?.name||'梳理决策'}。\n此预览未展开本轮的全部历史消息。`;}
          else{contextLabel='上下文 · 已采集的工具结果';contextText='[产品周记]\n降低记录与回顾成本，让功能在需要的时候自然出现。\n\n运行开始阶段未采集。';}
          const d=create('details');d.dataset.disclosure='context';const sum=create('summary','pa-section-label cursor-interaction',contextLabel);d.append(sum);code(d,contextText);input.append(d);
        }else if(n.input!==undefined&&n.input!==null)code(input,n.input);
        else input.append(create('p','pa-prose',n.status==='gap'?'未记录输入。':'此节点记录阶段状态，具体输入见所属模型或工具调用。'));
        const output=section(n.kind==='tool'?'工具结果':'输出',status==='running'?'接收中':'');
        if(status==='running'){output.append(create('p','pa-prose',n.kind==='model'||n.kind==='attempt'?'正在接收模型输出…':'执行尚未结束，结果将在完成后显示。'));}
        else if(typeof n.output==='object')code(output,n.output);
        else output.append(create('p','pa-prose',n.output||'阶段已完成。'));
        if(n.kind==='model'){const d=create('details');d.dataset.disclosure='reasoning';const sum=create('summary','pa-section-label cursor-interaction','Reasoning');d.append(sum,create('p','pa-prose','该示例未记录 Provider 返回的 reasoning。'));content.append(d);}
      }
      if(preserve){for(const el of content.querySelectorAll('[data-disclosure]'))el.open=disclosures.get(el.dataset.disclosure)||false;if(focusedDisclosure)[...content.querySelectorAll('[data-disclosure]')].find(el=>el.dataset.disclosure===focusedDisclosure)?.querySelector('summary')?.focus({preventScroll:true});content.scrollTop=oldScroll;}else content.scrollTop=0;
    }
    function render(){renderSummary();renderTree();renderDetails();icons();}
    function setRun(id){stopTimer();run=runs.find(r=>r.id===id);selected=run.selected;collapsed=new Set(run.collapsed);tab='io';query='';clock=run.duration;simulation='idle';following=false;unseen=0;lastDetailKey='';$('#pa-search').value='';windowEl.classList.remove('pa-show-detail');$('#pa-run-menu').hidden=true;$('#pa-run-trigger').setAttribute('aria-expanded','false');renderTicks();render();treeScroll.scrollTop=0;save();}
    function renderTicks(){const tick=$('#pa-ticks');tick.replaceChildren();for(const value of [0,run.duration/3,run.duration*2/3,run.duration])tick.append(create('span','',`${value.toFixed(1).replace(/\.0$/,'')}s`));}
    function stopTimer(){if(timer!==null){clearInterval(timer);timer=null;}}
    function latestNode(){const items=available();const leaves=items.filter(n=>!items.some(c=>c.parent===n.id));const active=leaves.filter(n=>n.start!==null&&n.end>clock).sort((a,b)=>b.start-a.start);return active[0]||leaves.sort((a,b)=>(b.end??0)-(a.end??0))[0]||items[0];}
    function tick(){if(!root.isConnected){stopTimer();return;}const prev=available().length;clock=Math.min(run.duration,clock+run.duration/28);const count=available().length-prev;if(following){const n=latestNode();selected=n.id;reveal(n.id);}else unseen+=count;render();if(following)scrollSelected();if(clock>=run.duration){stopTimer();simulation='idle';following=false;render();announce('模拟运行已完成，全部节点可以浏览。');}}
    $('#pa-simulate').addEventListener('click',()=>{if(simulation==='running'){stopTimer();simulation='paused';render();return;}if(simulation==='paused'){simulation='running';timer=setInterval(tick,800);render();return;}clock=0;simulation='running';following=true;selected='receive';collapsed=new Set();query='';$('#pa-search').value='';unseen=0;lastDetailKey='';if(run.id==='long')selected='c1';render();timer=setInterval(tick,800);announce('开始模拟实时事件；选择旧节点会停止跟随，但模拟继续。');});
    $('#pa-follow').addEventListener('click',()=>{query='';$('#pa-search').value='';following=simulation!=='idle';unseen=0;const n=latestNode();selected=n.id;reveal(n.id);render();scrollSelected();save();});
    $('#pa-search').addEventListener('input',e=>{query=e.target.value;following=false;renderTree();icons();save();});
    $('#pa-expand').addEventListener('click',()=>{collapsed.clear();following=false;renderTree();icons();save();});
    $('#pa-collapse').addEventListener('click',()=>{collapsed=new Set(run.nodes.filter(n=>n.kind!=='run'&&run.nodes.some(c=>c.parent===n.id)).map(n=>n.id));following=false;renderTree();icons();save();});
    tree.addEventListener('click',e=>{const fold=e.target.closest('[data-fold]');if(fold){const id=fold.dataset.fold;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);following=false;renderTree();icons();save();return;}const select=e.target.closest('[data-select]');if(select)choose(select.dataset.select);});
    tree.addEventListener('keydown',e=>{const button=e.target.closest('[data-select]');if(!button)return;const id=button.dataset.select;const list=[...tree.querySelectorAll('.pa-node-select')];const index=list.findIndex(el=>el.dataset.select===id);if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();list[Math.max(0,Math.min(list.length-1,index+(e.key==='ArrowDown'?1:-1)))]?.focus();}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();if(e.key==='ArrowRight')collapsed.delete(id);else collapsed.add(id);renderTree();icons();save();}});
    for(const button of root.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{tab=button.dataset.tab;renderDetails(true);icons();content.scrollTop=0;save();});
    $('#pa-back').addEventListener('click',()=>{windowEl.classList.remove('pa-show-detail');const selectedButton=[...tree.querySelectorAll('.pa-node-select')].find(b=>b.dataset.select===selected);selectedButton?.focus({preventScroll:true});});
    $('#pa-run-trigger').addEventListener('click',()=>{const menu=$('#pa-run-menu');menu.hidden=!menu.hidden;$('#pa-run-trigger').setAttribute('aria-expanded',String(!menu.hidden));});
    for(const item of runs){const b=create('button','pa-run-option cursor-interaction');b.type='button';b.dataset.run=item.id;b.append(create('span','',item.name),create('small','',`${item.time} · ${item.turns} Turns · ${item.nodes.length} 节点 · ${item.complete?'已完成':'有记录缺口'}`));b.onclick=()=>setRun(item.id);$('#pa-run-options').append(b);}
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#pa-run-menu').hidden=true;$('#pa-run-trigger').setAttribute('aria-expanded','false');}});
    root.addEventListener('click',e=>{if(!e.target.closest('.pa-run-picker')){$('#pa-run-menu').hidden=true;$('#pa-run-trigger').setAttribute('aria-expanded','false');}});
    const divider=$('#pa-divider');let resizing=false;
    divider.addEventListener('pointerdown',e=>{resizing=true;divider.setPointerCapture(e.pointerId);});
    divider.addEventListener('pointermove',e=>{if(!resizing)return;const rect=$('.pa-body').getBoundingClientRect();design.detailWidth=Math.max(30,Math.min(48,(rect.right-e.clientX)/rect.width*100));applyDesign();});
    divider.addEventListener('pointerup',()=>{resizing=false;save();});
    divider.addEventListener('pointercancel',()=>{resizing=false;});
    divider.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();design.detailWidth=Math.max(30,Math.min(48,design.detailWidth+(e.key==='ArrowLeft'?2:-2)));applyDesign();save();});
    window.addEventListener('pagehide',stopTimer,{once:true});
    window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(state&&state.privateContent?.revision!==lastSavedRevision&&restore(state)){lastDetailKey='';applyDesign();renderTicks();render();}});
    restore(window.openai?.widgetState);applyDesign();renderTicks();render();requestAnimationFrame(scrollSelected);
    if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:windowEl,onChange:()=>{applyDesign();save();}});tweak.addToggle(design,'narrow',{label:'窄面板预览'});tweak.addSlider(design,'rowHeight',{label:'轨迹行高',min:32,max:46,step:1,unit:'px'});tweak.addSlider(design,'detailWidth',{label:'详情区域占比',min:30,max:48,step:1,unit:'%'});}
  })();
  </script>
